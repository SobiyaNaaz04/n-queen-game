<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>N-Queens Interactive App</title>
<style>
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    background: #eef2f3;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 15px;
    min-height: 100vh;
  }
  h1 {
    margin-bottom: 10px;
    color: #446;
  }
  #app-container {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    max-width: 100%;
    width: 370px;
  }
  label {
    font-weight: 600;
    display: inline-block;
    margin-bottom: 8px;
    font-size: 16px;
  }
  input[type="number"] {
    width: 60px;
    font-size: 16px;
    padding: 5px;
    text-align: center;
    border: 2px solid #667;
    border-radius: 8px;
    margin-left: 10px;
  }
  button {
    margin-top: 15px;
    width: 100%;
    padding: 11px;
    font-weight: bold;
    font-size: 18px;
    background: #3a5fcd;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background: #2b4ebc;
  }
  button:disabled {
    background: #7b8dbf;
    cursor: not-allowed;
  }
  #board {
    margin-top: 20px;
    display: grid;
    gap: 2px;
    user-select: none;
  }
  .cell {
    aspect-ratio: 1 / 1;
    background-color: #f6f8fa;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    cursor: default;
  }
  .cell.dark {
    background-color: #6178a1;
    color: white;
  }
  .queen {
    color: #e33e2b;
  }
  #status {
    margin-top: 18px;
    font-weight: 600;
    text-align: center;
    font-size: 18px;
  }
  @media (max-width: 400px) {
    #app-container {
      width: 95vw;
    }
    .cell {
      font-size: 22px;
    }
  }
</style>
</head>
<body>
<h1>N-Queens Interactive App</h1>
<div id="app-container">
  <label for="nInput">Enter Board Size (N):</label><input id="nInput" type="number" value="8" min="4" max="12"/>
  <button id="solveBtn">Solve</button>
  <div id="board"></div>
  <div id="status"></div>
</div>

<script>
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const solveBtn = document.getElementById('solveBtn');
  const nInput = document.getElementById('nInput');

  function createBoard(n, queens=[]) {
    boardEl.style.gridTemplateColumns = repeat(${n}, 1fr);
    boardEl.innerHTML = '';
    for(let r=0; r<n; r++) {
      for(let c=0; c<n; c++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        if((r+c) % 2 === 1) cell.classList.add('dark');
        if(queens[r] === c) cell.innerHTML = '<span class="queen">&#9819;</span>';
        boardEl.appendChild(cell);
      }
    }
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function solveNQueens() {
    let n = parseInt(nInput.value);
    if (n < 4 || n > 12) {
      alert("Please enter a value between 4 and 12.");
      return;
    }
    solveBtn.disabled = true;
    nInput.disabled = true;
    statusEl.textContent = "Solving...";
    let queens = Array(n).fill(-1);
    createBoard(n);
    let success = await backtrack(0, n, queens);
    if(success) {
      statusEl.textContent = "Solution found!";
    } else {
      statusEl.textContent = "No solution exists for N = " + n;
    }
    solveBtn.disabled = false;
    nInput.disabled = false;
  }

  async function backtrack(row, n, queens) {
    if(row === n) {
      createBoard(n, queens);
      return true;
    }
    for(let col=0; col<n; col++) {
      if(isSafe(row, col, queens)) {
        queens[row] = col;
        createBoard(n, queens);
        await sleep(400);
        if(await backtrack(row + 1, n, queens)) return true;
        queens[row] = -1;
        createBoard(n, queens);
        await sleep(150);
      }
    }
    return false;
  }

  function isSafe(row, col, queens) {
    for(let r=0; r<row; r++) {
      if(queens[r] === col || Math.abs(queens[r] - col) === row - r) {
        return false;
      }
    }
    return true;
  }

  solveBtn.addEventListener('click', solveNQueens);

  // Create initial empty board with default 8x8 size
  createBoard(8);
</script>
</body>
</html>
