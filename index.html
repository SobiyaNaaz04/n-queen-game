<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>N-Queens Manual Interactive Puzzle</title>
<style>
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: #eef2f3;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .container {
    max-width: 420px;
    width: 100%;
    background: white;
    border-radius: 12px;
    box-shadow: 0 16px 32px rgba(0,0,0,0.15);
    padding: 25px;
    text-align: center;
  }
  h1 {
    margin-bottom: 10px;
    color: #3a4761;
  }
  label, input {
    font-size: 18px;
    vertical-align: middle;
  }
  input[type="number"] {
    width: 60px;
    padding: 5px;
    margin-left: 8px;
    border-radius: 8px;
    border: 1.8px solid #5a6a9d;
    text-align: center;
  }
  button {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    font-weight: 700;
    font-size: 20px;
    border-radius: 14px;
    border: none;
    background-color: #3a6ecc;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover:enabled {
    background-color: #2a52ad;
  }
  button:disabled {
    background-color: #7a8fbf;
    cursor: not-allowed;
  }
  #board {
    margin-top: 20px;
    display: grid;
    gap: 1px;
    user-select: none;
  }
  .cell {
    aspect-ratio: 1 / 1;
    background-color: #f7f9fc;
    font-size: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    color: #d84c44;
    border-radius: 4px;
  }
  .cell.dark { background-color: #556dad; color: white; }
  #status {
    margin-top: 20px;
    font-weight: 600;
    font-size: 20px;
    min-height: 28px;
  }
  @media (max-width: 450px) {
    .container {
      max-width: 95vw;
    }
    .cell {
      font-size: 18px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>N-Queens Puzzle</h1>
  <label for="boardSize">Board Size (N):</label>
  <input type="number" min="4" max="12" value="8" id="boardSize" />
  <button id="resetBtn">Reset Board</button>
  <div id="board"></div>
  <div id="status"></div>
</div>

<script>
  const boardSizeInput = document.getElementById('boardSize');
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('resetBtn');
  
  let N = parseInt(boardSizeInput.value);
  let queens = Array(N).fill(false).map(() => Array(N).fill(false));
  
  function createBoard(n) {
    N = n;
    queens = Array(n).fill(false).map(() => Array(n).fill(false));
    statusEl.textContent = "";
    boardEl.style.gridTemplateColumns = repeat(${n}, 1fr);
    boardEl.innerHTML = "";
    
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell ' + ((r + c) % 2 === 1 ? 'dark' : '');
        cell.dataset.row = r;
        cell.dataset.col = c;
        cell.addEventListener('click', () => toggleQueen(r, c));
        boardEl.appendChild(cell);
      }
    }
  }
  
  function toggleQueen(r, c) {
    queens[r][c] = !queens[r][c];
    updateBoard();
    checkValidity();
  }
  
  function updateBoard() {
    const cells = boardEl.children;
    for (let i = 0; i < cells.length; i++) {
      const cell = cells[i];
      const r = parseInt(cell.dataset.row);
      const c = parseInt(cell.dataset.col);
      cell.textContent = queens[r][c] ? '♛' : '';
    }
  }
  
  function checkValidity() {
    const positions = [];
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        if (queens[r][c]) {
          positions.push([r, c]);
        }
      }
    }
    if (positions.length !== N) {
      statusEl.textContent = Place exactly ${N} queens;
      statusEl.style.color = 'orange';
      return false;
    }
    if (isValidArrangement(positions)) {
      statusEl.textContent = "Valid solution! 👏";
      statusEl.style.color = 'green';
      return true;
    } else {
      statusEl.textContent = "Invalid solution - queens are attacking!";
      statusEl.style.color = 'red';
      return false;
    }
  }
  
  function isValidArrangement(positions) {
    for(let i = 0; i < positions.length; i++) {
      for(let j = i + 1; j < positions.length; j++) {
        if(attacking(positions[i], positions[j])) return false;
      }
    }
    return true;
  }
  
  function attacking(a, b) {
    return (
      a[0] === b[0] ||     // same row
      a[1] === b[1] ||     // same col
      Math.abs(a[0] - b[0]) === Math.abs(a[1] - b[1])  // diagonal
    );
  }
  
  resetBtn.addEventListener('click', () => {
    createBoard(parseInt(boardSizeInput.value));
  });

  boardSizeInput.addEventListener('change', () => {
    let val = parseInt(boardSizeInput.value);
    if(val < 4) val = 4;
    if(val > 12) val = 12;
    boardSizeInput.value = val;
    createBoard(val);
  });
  
  // Initial board
  createBoard(N);
</script>

</body>
</html>
